<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K线生成器</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:12px;background:#0b1220;color:#e2e8f0;
       font-family:system-ui,sans-serif;display:flex}
  .layout{display:flex;gap:12px;width:100%;min-height:0}
  .left{width:400px;flex:none;display:flex;flex-direction:column;min-height:0}
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex:none}
  .topbar label{font-size:13px;color:#94a8bf}
  .topbar input{width:76px;padding:4px 7px;background:#0b1522;color:#e2e8f0;
    border:1px solid #2b3d55;border-radius:6px;font-family:monospace;outline:none;font-size:12px}
  .topbar input:focus{border-color:#3b82f6}

  .head,.row{display:grid;grid-template-columns:32px repeat(4,1fr) 1.5fr;gap:4px}
  .head{font-size:11px;color:#6b8199;text-align:center;margin-bottom:4px;flex:none}

  #viewport{flex:1;overflow-y:auto;position:relative;min-height:80px;
    scrollbar-gutter:stable;padding-right:2px}
  #spacer{width:1px;pointer-events:none}
  #visible{position:absolute;left:0;right:2px;top:0}

  .row{height:24px;align-items:center;margin-bottom:4px}
  .row .idx{font-size:11px;color:#6b8199;display:flex;align-items:center;justify-content:center;height:100%}
  .row input{width:100%;height:20px;padding:0 4px;background:#0b1522;color:#e2e8f0;
    border:1px solid #2b3d55;border-radius:4px;font-family:monospace;font-size:11px;outline:none}
  .row input:focus{border-color:#3b82f6}
  .row input.lbl{color:#fbbf24}
  .row input.lbl:focus{border-color:#fbbf24}
  .row.hl{background:rgba(251,191,36,.12);border-radius:4px}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}

  .bulk{flex:none;margin-top:10px;border-top:1px solid #24344a;padding-top:8px}
  .bulk textarea{width:100%;height:56px;resize:none;background:#0b1522;color:#e2e8f0;
    border:1px solid #2b3d55;border-radius:6px;padding:6px 8px;
    font:12px monospace;outline:none}
  .bulk textarea:focus{border-color:#3b82f6}
  #copyBtn{margin-top:6px;width:100%;padding:6px;border:1px solid #2b3d55;border-radius:6px;
    background:#16243a;color:#cfe0f5;font-size:12px;cursor:pointer}
  #copyBtn:hover{background:#1d2f4a;border-color:#3b82f6}

  .right{flex:1;min-width:0;min-height:0;background:#131e2e;border-radius:10px;padding:8px}
  canvas{width:100%;height:100%;display:block;cursor:crosshair}
  @media(max-width:760px){
    .layout{flex-direction:column}
    .left{width:100%;height:55%;min-height:0}
    .right{height:45%}
  }
</style>
</head>
<body>
<div class="layout">
  <div class="left">
    <div class="topbar">
      <label>K线数量</label>
      <input type="number" id="count" min="1" max="8760" value="2">
    </div>
    <div class="head"><span>序号</span><span>O</span><span>H</span><span>L</span><span>C</span><span>标注</span></div>

    <div id="viewport">
      <div id="spacer"></div>
      <div id="visible"></div>
    </div>

    <div class="bulk">
      <textarea id="bulkText" placeholder="粘贴数据：每行 O H L C 标注（标注可选）"></textarea>
      <button id="copyBtn">复制表格数据</button>
    </div>
  </div>
  <div class="right"><canvas id="chart"></canvas></div>
</div>

<script>
const DEFAULT = [
  {o:100, h:122, l:92,  c:116, t: ''},
  {o:116, h:128, l:104, c:108, t: ''}
];
const KEYS  = ['o','h','l','c'];
const STORE = 'kline-data';
const MAXN  = 8760;

const RH = 24;
const ROW_FULL = RH + 4;
const BUFFER = 6;

let values, labels, count;
let start = 0, span = 1;
let startRow = 0, endRow = 0;
let selected = -1;

(function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
  let v = null, l = null;
  if (Array.isArray(raw) && raw.length > 0 && raw.length % 4 === 0) {
    v = raw; l = new Array(v.length / 4).fill('');
  } else if (raw && Array.isArray(raw.v) && raw.v.length % 4 === 0) {
    v = raw.v; l = Array.isArray(raw.l) ? raw.l : new Array(v.length / 4).fill('');
  }
  if (v) {
    values = v;
    labels = l;
    count  = Math.min(values.length / 4, MAXN);
    values.length = count * 4;
    labels.length = count;
  } else {
    count  = DEFAULT.length;
    values = DEFAULT.flatMap(d => KEYS.map(k => d[k]));
    labels = DEFAULT.map(d => d.t);
  }
})();

function defaultVal(i, j) {
  const round = Math.floor(i / DEFAULT.length);
  return +(DEFAULT[i % DEFAULT.length][KEYS[j]] + round * 8).toFixed(2);
}

function save() {
  localStorage.setItem(STORE, JSON.stringify({ v: values, l: labels }));
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ===== 虚拟滚动（倒序显示） =====
const viewport = document.getElementById('viewport');
const spacer   = document.getElementById('spacer');
const visible  = document.getElementById('visible');

function layout() {
  spacer.style.height = (count * ROW_FULL) + 'px';
  const maxScroll = Math.max(0, count * ROW_FULL - viewport.clientHeight);
  if (viewport.scrollTop > maxScroll) viewport.scrollTop = maxScroll;
  update(true);
}

function update(force) {
  if (!viewport.clientHeight) return;

  const st = viewport.scrollTop;
  const vh = viewport.clientHeight;
  const s = Math.max(0, Math.floor(st / ROW_FULL) - BUFFER);
  const e = Math.min(count, Math.ceil((st + vh) / ROW_FULL) + BUFFER);

  if (!force && s === startRow && e === endRow) return;

  const ae = document.activeElement;
  let focusSel = null;
  if (ae && ae.dataset && visible.contains(ae)) {
    if (ae.dataset.idx != null) focusSel = `input[data-idx="${ae.dataset.idx}"]`;
    else if (ae.dataset.labelIdx != null) focusSel = `input[data-label-idx="${ae.dataset.labelIdx}"]`;
  }

  startRow = s;
  endRow = e;
  visible.style.top = (startRow * ROW_FULL) + 'px';

  let html = '';
  for (let r = startRow; r < endRow; r++) {
    const i = count - 1 - r;             // 倒序：表格行 r → 数据索引 i
    if (i < 0) continue;
    const hl = (i === selected) ? ' hl' : '';
    html += `<div class="row${hl}"><span class="idx">${i+1}</span>`;
    for (let j = 0; j < 4; j++) {
      const idx = i * 4 + j;
      html += `<input type="number" step="any" data-idx="${idx}" value="${values[idx] ?? ''}" title="${KEYS[j].toUpperCase()}">`;
    }
    html += `<input class="lbl" type="text" data-label-idx="${i}" value="${esc(labels[i] || '')}" placeholder="标注" title="第${i+1}根标注">`;
    html += `</div>`;
  }
  visible.innerHTML = html;

  if (focusSel) {
    const el = visible.querySelector(focusSel);
    if (el) el.focus();
  }
}

let ticking = false;
viewport.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    update(false);
  });
});

visible.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.idx != null) values[+t.dataset.idx] = t.value;
  else if (t.dataset.labelIdx != null) labels[+t.dataset.labelIdx] = t.value;
  else return;
  save();
  draw();
});

visible.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const inp = row.querySelector('input[data-idx]');
  if (!inp) return;
  const i = Math.floor(+inp.dataset.idx / 4);
  if (i !== selected) { selected = i; draw(); update(true); }
});

new ResizeObserver(() => update(true)).observe(viewport);

// ===== 数量变化 =====
const countInput = document.getElementById('count');

function applyCount() {
  let n = parseInt(countInput.value, 10);
  if (!Number.isFinite(n)) n = count;
  n = Math.max(1, Math.min(MAXN, n));
  countInput.value = n;
  if (n === count) return;

  while (values.length < n * 4) {
    values.push(defaultVal((values.length / 4) | 0, values.length % 4));
  }
  if (values.length > n * 4) values.length = n * 4;
  while (labels.length < n) labels.push('');
  if (labels.length > n) labels.length = n;

  count = n;
  selected = -1;
  start = 0;
  span  = count;
  viewport.scrollTop = 0;
  layout();
  save();
  draw();
}

countInput.addEventListener('change', applyCount);
countInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); countInput.blur(); }
});

// ===== 批量输入（单向，正序解析：第一行 = 第 1 根） =====
const bulkText = document.getElementById('bulkText');
const copyBtn  = document.getElementById('copyBtn');

function parseBulk(text) {
  text = text.trim();
  if (!text) return null;
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

  if (lines.length === 1) {
    const nums = text.match(/-?\d+(?:\.\d+)?/g) || [];
    if (nums.length < 4) return null;
    const n = Math.ceil(nums.length / 4);
    const vs = [], ls = [];
    for (let k = 0; k < n * 4; k++) {
      vs.push(k < nums.length ? nums[k] : '');
      if (k % 4 === 3) ls.push('');
    }
    return { vs, ls };
  }

  const vs = [], ls = [];
  for (const line of lines) {
    const ms = [...line.matchAll(/-?\d+(?:\.\d+)?/g)];
    if (ms.length < 4) continue;
    for (let k = 0; k < 4; k++) vs.push(ms[k][0]);
    const last = ms[3];
    ls.push(line.slice(last.index + last[0].length).trim());
  }
  if (!ls.length) return null;
  return { vs, ls };
}

bulkText.addEventListener('input', () => {
  const r = parseBulk(bulkText.value);
  if (!r) return;

  let n = Math.max(1, Math.min(MAXN, r.ls.length));
  const nv = r.vs.slice(0, n * 4);
  const nl = r.ls.slice(0, n);
  while (nv.length < n * 4) {
    const k = nv.length;
    nv.push(values[k] ?? defaultVal((k / 4) | 0, k % 4));
  }
  while (nl.length < n) nl.push('');

  values = nv;
  labels = nl;
  count  = n;
  countInput.value = n;
  selected = -1;
  start = 0;
  span  = count;
  viewport.scrollTop = 0;
  layout();
  save();
  draw();
});

// ===== 复制（★ 正序：第 1 根在前，与粘贴解析方向一致，往返不翻转） =====
copyBtn.addEventListener('click', async () => {
  const lines = [];
  for (let i = 0; i < count; i++) {      // 正序，与 values 数组顺序一致
    const base = values.slice(i * 4, i * 4 + 4).join(' ');
    const lb = (labels[i] || '').trim();
    lines.push(lb ? base + ' ' + lb : base);
  }
  const text = lines.join('\n');

  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const old = copyBtn.textContent;
  copyBtn.textContent = '已复制 ✓';
  setTimeout(() => copyBtn.textContent = old, 1200);
});

// ===== 绘图 =====
const cvs = document.getElementById('chart');
const ctx = cvs.getContext('2d');

const TRACK = 40;

function plotBox() {
  const W = cvs.clientWidth, H = cvs.clientHeight;
  const L = 62, R = 22, T = 6, B = 34;
  const x0 = L, x1 = W - R;
  const trackY0 = T, trackY1 = T + TRACK;
  const y0 = trackY1, y1 = H - B;
  return { W, H, x0, x1, trackY0, trackY1, y0, y1, pw: x1 - x0 };
}

function axisArrow(x1, y1, x2, y2) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 8;
  ctx.strokeStyle = '#5b6b80'; ctx.fillStyle = '#5b6b80'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(a - .4) * h, y2 - Math.sin(a - .4) * h);
  ctx.lineTo(x2 - Math.cos(a + .4) * h, y2 - Math.sin(a + .4) * h);
  ctx.closePath(); ctx.fill();
}

function drawTrack(items, x0, x1, trackY0, trackY1) {
  ctx.strokeStyle = 'rgba(148,163,184,.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, trackY1 + 0.5); ctx.lineTo(x1, trackY1 + 0.5); ctx.stroke();

  if (!items.length) return;

  ctx.save();
  ctx.font = '11px system-ui, sans-serif';

  const ROW_H = 18;
  const MAX_ROW = Math.max(1, Math.floor(TRACK / ROW_H));
  const rows = [];
  const placed = [];

  items.sort((a, b) => (b.sel - a.sel) || (a.cx - b.cx));

  for (const it of items) {
    const tw = ctx.measureText(it.text).width + 10;
    let left = it.cx - tw / 2;
    left = Math.max(x0 + 2, Math.min(left, x1 - tw - 2));
    const right = left + tw;

    let row = -1;
    for (let r = 0; r < MAX_ROW; r++) {
      if (!rows[r] || rows[r] < left - 2) { row = r; break; }
    }
    if (row < 0) continue;
    rows[row] = right;
    placed.push({ ...it, left, right, row, tw });
  }

  ctx.setLineDash([2, 3]);
  ctx.lineWidth = 1;
  for (const p of placed) {
    const cy = trackY0 + ROW_H / 2 + p.row * ROW_H;
    ctx.strokeStyle = p.sel ? 'rgba(251,191,36,.55)' : 'rgba(96,165,250,.38)';
    ctx.beginPath();
    ctx.moveTo((p.left + p.right) / 2, cy + 8);
    ctx.lineTo(p.cx, Math.max(p.yH - 2, cy + 10));
    ctx.stroke();
  }
  ctx.setLineDash([]);

  for (const p of placed) {
    const cy = trackY0 + ROW_H / 2 + p.row * ROW_H;
    ctx.fillStyle = p.sel ? '#fbbf24' : 'rgba(96,165,250,.92)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.left, cy - 8, p.tw, 16, 4);
    else ctx.rect(p.left, cy - 8, p.tw, 16);
    ctx.fill();

    ctx.fillStyle = '#0b1220';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.text, (p.left + p.right) / 2, cy);
  }
  ctx.restore();
}

function draw() {
  const { W, H, x0, x1, trackY0, trackY1, y0, y1, pw } = plotBox();
  if (!W || !H) return;
  const dpr = devicePixelRatio || 1;
  cvs.width = W * dpr; cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const data = [];
  for (let i = 0; i < count; i++) {
    data.push({ o: +values[i*4], h: +values[i*4+1], l: +values[i*4+2], c: +values[i*4+3] });
  }
  if (data.some(d => [d.o,d.h,d.l,d.c].some(v => !isFinite(v)))) {
    ctx.fillStyle = '#f59e0b'; ctx.font = '14px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('请输入完整有效的数字', W/2, H/2);
    return;
  }

  span  = Math.max(1, Math.min(span, count));
  start = Math.max(0, Math.min(start, Math.max(0, count - span)));

  const i0 = Math.max(0, Math.floor(start) - 1);
  const i1 = Math.min(count - 1, Math.ceil(start + span) + 1);

  let hi = -Infinity, lo = Infinity;
  for (let i = i0; i <= i1; i++) {
    const d = data[i];
    hi = Math.max(hi, d.h, d.o, d.c);
    lo = Math.min(lo, d.l, d.o, d.c);
  }
  const pad = (hi - lo) * 0.1 || 1;
  hi += pad; lo -= pad;

  const toY = p => y1 - (p - lo) / (hi - lo) * (y1 - y0);
  const yZero = Math.max(y0, Math.min(y1, toY(0)));

  axisArrow(x0, y1, x0, trackY0);
  axisArrow(x0, yZero, x1, yZero);

  ctx.font = '12px monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const p = lo + (hi - lo) * i / 4, y = toY(p);
    ctx.strokeStyle = 'rgba(148,163,184,.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillStyle = '#6b8199'; ctx.fillText(p.toFixed(2), x0 - 10, y);
  }

  if (yZero > y0 + 2 && yZero < y1 - 2) {
    ctx.fillStyle = '#94a8bf'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('0', x0 - 10, yZero);
  }

  const slot = pw / span;
  const bw = Math.max(slot * 0.82, 1);
  const lw = slot > 8 ? 1.5 : 1;
  const showBottom = slot >= 34;

  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, pw, y1 - y0);
  ctx.clip();

  if (selected >= 0 && selected >= i0 && selected <= i1) {
    const sx = x0 + (selected - start + 0.5) * slot;
    ctx.fillStyle = 'rgba(251,191,36,.10)';
    ctx.fillRect(sx - slot / 2, y0, slot, y1 - y0);
  }

  for (let i = i0; i <= i1; i++) {
    const d = data[i];
    const cx = x0 + (i - start + 0.5) * slot;
    if (cx < x0 - slot || cx > x1 + slot) continue;

    const up = d.c >= d.o;
    const color = up ? '#ef4444' : '#54fcfc';
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = lw;

    const yo = toY(d.o), yc = toY(d.c);
    const mid = (yo + yc) / 2;
    const bh = Math.max(Math.abs(yc - yo), up ? lw * 2 + 1 : 1);
    const top = mid - bh / 2;
    const bottom = top + bh;

    ctx.beginPath(); ctx.moveTo(cx, toY(d.h)); ctx.lineTo(cx, top); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, bottom); ctx.lineTo(cx, toY(d.l)); ctx.stroke();

    if (up) ctx.strokeRect(cx - bw / 2, top, bw, bh);
    else    ctx.fillRect(cx - bw / 2, top, bw, bh);

    if (i === selected) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 1;
      const yH = toY(d.h), yL = toY(d.l);
      ctx.strokeRect(cx - bw / 2 - 3, Math.min(yH, yL) - 3, bw + 6, Math.abs(yL - yH) + 6);
    }

    if (showBottom) {
      ctx.fillStyle = i === selected ? '#fbbf24' : '#6b8199';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = '12px monospace';
      ctx.fillText('第' + (i + 1) + '根', cx, y1 + 12);
    }
  }
  ctx.restore();

  const trackItems = [];
  for (let i = i0; i <= i1; i++) {
    const lb = (labels[i] || '').trim();
    if (!lb) continue;
    const cx = x0 + (i - start + 0.5) * slot;
    if (cx < x0 - 40 || cx > x1 + 40) continue;
    trackItems.push({ cx, text: lb, yH: toY(data[i].h), sel: i === selected });
  }
  drawTrack(trackItems, x0, x1, trackY0, trackY1);
}

function selectK(i) {
  selected = i;
  draw();

  const r = count - 1 - i;
  const vh = viewport.clientHeight;
  const target = r * ROW_FULL - vh / 2 + ROW_FULL / 2;
  viewport.scrollTop = Math.max(0, Math.min(target, count * ROW_FULL - vh));
  update(true);

  const el = visible.querySelector(`input[data-label-idx="${i}"]`);
  if (el) { el.focus(); el.select(); }
}

cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const { x0, x1, pw } = plotBox();
  const rect = cvs.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  if (mx < x0 || mx > x1 || pw <= 0) return;

  const ratio  = (mx - x0) / pw;
  const dataX  = start + ratio * span;
  const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
  const newSpan = Math.max(1, Math.min(span * factor, count));

  span  = newSpan;
  start = Math.max(0, Math.min(dataX - ratio * span, Math.max(0, count - span)));
  draw();
}, { passive: false });

let dragging = false, dragX = 0, dragStart = 0, downX = 0, moved = false;

cvs.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  dragging = true;
  moved = false;
  dragX = e.clientX;
  downX = e.clientX;
  dragStart = start;
  cvs.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  if (Math.abs(e.clientX - downX) > 4) moved = true;
  const { pw } = plotBox();
  if (pw <= 0) return;
  const slot = pw / span;
  const dx = e.clientX - dragX;
  start = Math.max(0, Math.min(dragStart - dx / slot, Math.max(0, count - span)));
  draw();
});

window.addEventListener('mouseup', e => {
  if (!dragging) return;
  dragging = false;
  cvs.style.cursor = 'crosshair';

  if (moved) return;
  const rect = cvs.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const { x0, x1, pw } = plotBox();
  if (mx < x0 || mx > x1 || pw <= 0) return;
  const slot = pw / span;
  const i = Math.floor((mx - x0) / slot + start);
  if (i >= 0 && i < count) selectK(i);
});

new ResizeObserver(draw).observe(cvs);

countInput.value = count;
start = 0;
span  = count;
viewport.scrollTop = 0;
layout();
draw();
</script>
</body>
